# Headless unit tests for TRP3FW.
#
# Runs on the dev branches only. The stripped release branches (v1.6, v1.5)
# have no tests/ tree by design, so there is nothing to run there.
#
# This workflow is read-only: it checks out, runs the suite, and reports. It
# holds no secrets and never pushes. Releases stay a deliberate local action
# via scripts/make-release.sh.
name: tests

on:
  push:
    branches:
      - '*-dev'
  pull_request:
    branches:
      - '*-dev'

jobs:
  headless:
    # The act_runners on this instance register with the single label "docker"
    # (Settings -> Actions -> Runners). That label carries no implicit image, so
    # the container is named explicitly below rather than relying on a default.
    runs-on: docker
    container:
      image: node:20-bookworm

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # Runs as root inside the container, so no sudo. The lua5.1 package
      # provides both /usr/bin/lua5.1 and /usr/bin/luac5.1.
      - name: Install Lua 5.1
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends lua5.1

      - name: Show interpreter version
        run: lua5.1 -v

      # run_headless.lua exits non-zero on any failure, so this step alone
      # gates the build.
      - name: Run headless suite
        run: lua5.1 tests/run_headless.lua

      # Parse-check every shipping Lua file. Catches syntax errors in files
      # that no unit spec happens to load.
      # Kept POSIX-sh compatible (no process substitution): act_runner does not
      # guarantee bash for `run:` steps.
      - name: Syntax-check all addon sources
        run: |
          if ! command -v luac5.1 >/dev/null 2>&1; then
            echo "luac5.1 not available on this runner image; skipping parse check"
            exit 0
          fi
          find core features hooks location ui -name '*.lua' > /tmp/luafiles
          echo TRP3FW.lua >> /tmp/luafiles
          echo commands.lua >> /tmp/luafiles
          echo status.lua >> /tmp/luafiles
          fail=0
          while IFS= read -r f; do
            luac5.1 -p "$f" || { echo "SYNTAX ERROR: $f"; fail=1; }
          done < /tmp/luafiles
          echo "parse-checked $(wc -l < /tmp/luafiles) files"
          exit $fail
